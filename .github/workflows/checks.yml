name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # the oldest python3 the Mac app may pick up (Xcode CLT)
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Script syntax
        run: |
          for f in scripts/*.sh frame/*/*.sh; do
            case "$(head -n 1 "$f")" in
              *zsh*) zsh -n "$f" ;;
              *) bash -n "$f" ;;
            esac
          done
      - name: Python compiles
        run: python -m py_compile ui/*.py apk-catalog/*.py frame/android/*.py
      - name: Server tests
        run: python -m unittest discover -s tests -v
      - name: App syntax
        run: node --check app/main.js && node --check app/build/make-icon.js
